name: dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every action is pinned to a full commit SHA (release tag in the trailing comment).

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only to post the summary comment when the review fails
    steps:
      # fail-on-scopes filters the changes before BOTH the vulnerability and the license check run
      # (src/main.ts), so the two checks are separate steps with different scopes.
      # Advisory check: it is not a required status check on main, so a failure flags the PR but does
      # not by itself prevent the merge (see docs/repository-controls.md).
      - name: Vulnerabilities (all dependency scopes)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail on a dependency with a known moderate (or worse) advisory, whatever its scope:
          # scratchpool has no runtime dependencies, so devDependencies and Actions are what matter.
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: on-failure
      - name: Licenses (runtime dependencies)
        if: ${{ !cancelled() }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # License policy applies to runtime dependencies (scratchpool ships none today; this keeps it that way
          # unless the license is one Apache-2.0 can redistribute).
          vulnerability-check: false
          fail-on-scopes: runtime
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0,
            CC0-1.0, Unlicense, Zlib, Python-2.0
          comment-summary-in-pr: never

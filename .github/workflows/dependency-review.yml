name: dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every action is pinned to a full commit SHA (release tag in the trailing comment).

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only to post the summary comment when the review fails
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block a PR that adds or upgrades to a dependency with a known moderate (or worse) advisory.
          fail-on-severity: moderate
          # License policy applies to runtime dependencies (scratchpool ships none today; this keeps it that way
          # unless the license is one Apache-2.0 can redistribute).
          fail-on-scopes: runtime
          allow-licenses: >-
            Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0,
            CC0-1.0, Unlicense, Zlib, Python-2.0
          comment-summary-in-pr: on-failure

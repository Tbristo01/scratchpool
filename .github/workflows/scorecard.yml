name: scorecard

on:
  # Re-score when branch protection changes, weekly, and on every push to main.
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]

# Read-only by default (official Scorecard template); the job widens only what it needs.
permissions: read-all

# Every action is pinned to a full commit SHA (release tag in the trailing comment).
# publish_results: true requires this workflow to stay minimal: no top-level env or defaults,
# no other jobs, and only the actions below.

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results (OIDC) for the public Scorecard API and badge
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
